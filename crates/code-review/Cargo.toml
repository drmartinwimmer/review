[package]
name = "code-review"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A suite of code review skills, purist AST linter, and Inspect AI evals"
readme = "README.md"

[[bin]]
name = "code-review"
path = "src/main.rs"
required-features = ["fancy"]

[features]
default = ["fancy"]
fancy = ["code-review-check/fancy", "purist/fancy"]

[dependencies]
clap = { workspace = true }
thiserror = { workspace = true }
code-review-configure-lints = { workspace = true }
code-review-check = { workspace = true }
purist = { workspace = true }
api-manifest = { workspace = true }
code-review-coverage = { workspace = true }

[dev-dependencies]
googletest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
