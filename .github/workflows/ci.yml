name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Formatting & Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install external check tools (cargo-audit, taplo)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,taplo-cli

      - name: Install Prettier
        run: npm install -g prettier

      - name: Check code formatting (Rust)
        run: cargo fmt --check

      - name: Check Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run purist AST linter
        run: cargo run -p code-review -- purist

      - name: Check TOML formatting (Taplo)
        run: taplo fmt --check

      - name: Check Markdown and JSON formatting (Prettier)
        run: prettier --check "**/*.{md,json}"

      - name: Run cargo security audit
        run: cargo audit

      - name: Run code-review check aggregator
        run: cargo run -p code-review -- check

      - name: Verify package & metadata
        run: |
          cargo metadata --format-version 1 --no-deps > /dev/null
          cargo publish --dry-run -p code-review-check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Jujutsu (jj)
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli

      - name: Configure Git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"

      - name: Run cargo test
        run: cargo test --all-targets --all-features

  nix:
    name: Nix Flake Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Check Nix flake
        run: nix flake check

      - name: Build Nix package
        run: nix build

      - name: Verify direnv in standard checkout and secondary jj workspace
        run: |
          nix shell --flake-registry "" --inputs-from . nixpkgs#direnv --command bash -euo pipefail <<'EOF'
          expected_channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          [ -n "$expected_channel" ]

          verify_direnv() {
            local dir="$1"
            direnv allow "$dir"
            EXPECTED_CHANNEL="$expected_channel" direnv exec "$dir" bash -euo pipefail -c '
              [ -n "${IN_NIX_SHELL:-}" ]
              rustc --version | grep -E "^rustc ${EXPECTED_CHANNEL}(\.| )"
              cargo --version
              cargo-audit --version
              taplo --version
              prettier --version
            '
          }

          verify_direnv .

          mkdir -p .workspaces/ci-test
          trap 'rm -rf .workspaces' EXIT
          cp .envrc flake.nix flake.lock rust-toolchain.toml .workspaces/ci-test/
          [ ! -e .workspaces/ci-test/.git ]
          verify_direnv .workspaces/ci-test
          EOF

  auto-merge:
    name: Auto-Merge Dependabot PR
    needs: [lint, test, nix]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge patch, minor, and Nix flake updates
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          UPDATED_DEPS_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          SHOULD_MERGE=false
          if [ "$UPDATE_TYPE" = "version-update:semver-patch" ] || [ "$UPDATE_TYPE" = "version-update:semver-minor" ]; then
            SHOULD_MERGE=true
          elif echo "$UPDATED_DEPS_JSON" | jq -e '
            length > 0 and all(
              .updateType == "version-update:semver-patch"
              or .updateType == "version-update:semver-minor"
              or ((.newVersion // "") | test("^[0-9a-f]{40}$"))
            )
          ' > /dev/null; then
            SHOULD_MERGE=true
          fi

          if [ "$SHOULD_MERGE" = "true" ]; then
            gh pr review --approve "$PR_URL"
            if ! gh pr merge --auto --merge "$PR_URL"; then
              for attempt in 1 2 3; do
                if gh pr merge --merge "$PR_URL"; then
                  break
                fi
                if [ "$attempt" -lt 3 ]; then
                  sleep 5
                else
                  exit 1
                fi
              done
            fi
          else
            echo "Skipping auto-merge for update type: $UPDATE_TYPE"
          fi
