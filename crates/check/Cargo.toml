[package]
name = "code-review-check"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Check aggregator subcommand for code-review"
readme = "README.md"

[[bin]]
name = "check"
path = "src/main.rs"
required-features = ["fancy"]

[features]
default = ["fancy"]
fancy = ["miette/fancy", "purist/fancy"]

[dependencies]
annotate-snippets = { workspace = true }
anstyle = { workspace = true }
anstyle-query = { workspace = true }
clap = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
purist = { workspace = true }
api-manifest = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
googletest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
