[package]
name = "code-review"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A suite of code review skills, purist AST linter, and Inspect AI evals"
readme = "README.md"

[[bin]]
name = "code-review"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
thiserror = { workspace = true }
code-review-configure-lints = { workspace = true }
